name: Application checks

on:
  push:
    branches:
      - main
      - feature/application-language-support
      - feature/cash-complaints-pricing-dispatch
      - feature/smart-fare-customer-support
      - fix/application-audit-and-booking-permissions
      - fix/pickup-time-normalization
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate backend JavaScript syntax
        run: node --check server/index.js
      - name: Test shared validation utilities
        run: npm test
      - name: Build frontend
        run: npm run build
