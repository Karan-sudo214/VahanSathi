services:
  - type: web
    name: vaahansathi-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_PATH
        value: ./data/app.json
      - key: GEOCODER_URL
        value: https://nominatim.openstreetmap.org/search
      - key: DATABASE_URL
        sync: false
